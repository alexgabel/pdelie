[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdelie"
version = "0.31.0"
description = "V0.32 modern Scientific Python + PySINDy 2.1 downstream discovery task bridge — periodic scalar 1D PySINDy PDELibrary task runner (discovery_task_result) and diagnostic-only WeakPDELibrary wrapper (pdelie_weak_pde_library_diagnostic), submodule-only, with a public JSON-only example. Python >=3.12, NumPy 2.x, PySINDy 2.1.x."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Alex Gabel"},
]
keywords = [
  "lie-symmetry",
  "pde",
  "scientific-machine-learning",
  "symbolic-regression",
  "system-identification",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=2,<3",
]

[project.urls]
Homepage = "https://github.com/alexgabel/pdelie"
Repository = "https://github.com/alexgabel/pdelie"
Issues = "https://github.com/alexgabel/pdelie/issues"
Documentation = "https://pdelie.readthedocs.io/en/latest/"

# v0.32 modern-only compatibility policy — outcome A from the v0.31.1a
# research spike. The downstream bridge targets PySINDy 2.1.x on the
# modern Scientific Python stack (NumPy 2.x, SciPy 1.14+, scikit-learn
# 1.4+). PySINDy 2.x uses importlib.metadata instead of pkg_resources,
# so the v0.31c1 `setuptools<82` temporary cap is retired here.
#
# Floors follow Scientific Python SPEC 0 (~2 year window) plus the
# hard constraints imposed by pysindy 2.1.0's numpy>=2.0 requirement.
# The v0.31.x maintenance branch retains the legacy Python 3.11 /
# PySINDy 1.7.x line.
[project.optional-dependencies]
downstream = [
  "pysindy>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.14,<2",
]
xarray = [
  "xarray>=2024.6.0",
]
viz = [
  "matplotlib>=3.9,<4",
]
test = [
  "build>=1.2",
  "matplotlib>=3.9,<4",
  "mypy>=1.11",
  "pysindy>=2.1,<3",
  "pytest>=7.4",
  "pytest-cov>=5.0",
  "pyyaml>=6.0",
  "ruff>=0.6",
  "scikit-learn>=1.4,<2",
  "scipy>=1.14,<2",
  "xarray>=2024.6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# v0.30e: cross-cutting hygiene phase 1. All three tools are wired into
# non-blocking CI jobs; a red run reports but does not gate merges.

[tool.ruff]
target-version = "py312"
line-length = 120
# Rendered notebooks live in the tree as docs; nbsphinx builds them into
# the docs site. They are not treated as maintained code and are excluded.
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
extend-select = ["E", "W", "F", "B", "I", "UP", "RUF", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Per-version release-gate tests: heritage test files scheduled for narrow
# consolidation in v0.30f. Ruling out E402/E501/B905/RUF/UP here rather than
# tuning code that is about to be replaced.
"tests/test_v0_*_release_gate.py" = ["E402", "E501", "B905", "RUF012", "RUF022", "RUF043", "RUF059", "UP035"]
# Manufactured-solution tests document analytic residuals using math notation
# ("π²", "≤"). RUF003 flags them as ambiguous Unicode in comments/docstrings.
"tests/test_manufactured_nonperiodic_residuals.py" = ["RUF003"]
# Other test files with legitimate long fixture strings that predate the
# 120-char limit; consolidating each is not worth the churn for advisory lint.
"tests/test_reporting.py" = ["E501"]
"tests/test_weak_residual_reports.py" = ["E501"]
"tests/test_invariant_diagnostics.py" = ["E501"]
"tests/test_closure_runtime.py" = ["E501"]
"tests/test_translation_canonical_discovery_inputs.py" = ["E501"]
"tests/test_symmetry_candidate_validation.py" = ["E501"]
"tests/test_boundary_condition_spec.py" = ["E501"]
"tests/test_ingestion_parity.py" = ["E501"]
"tests/test_downstream_benchmark.py" = ["E501"]
"tests/test_weak_contract_integration.py" = ["E501"]
"tests/test_advection_diffusion_generator.py" = ["E501"]
"tests/test_discovery_evaluation.py" = ["E501"]
"tests/test_ks_promotion_decision.py" = ["E501"]
"tests/test_polynomial_translation.py" = ["E501"]
"tests/test_pysindy_bridge.py" = ["E501"]
"tests/test_robustness_utilities.py" = ["E501"]
"tests/test_kdv_feasibility.py" = ["RUF005"]
# test_data_xarray_adapter.py: xarray importorskip below imports (E402) +
# long fixture strings (E501)
"tests/test_data_xarray_adapter.py" = ["E501", "E402"]
"tests/_helpers/*.py" = ["E501", "B905", "RUF005"]
"tests/conftest.py" = ["E402"]
# Test files: broader ignores for advisory patterns whose per-file value is
# low. B905 (zip strict): tests iterate over paired fixtures where strict
# equality is guaranteed by construction. RUF043: pytest fixture-arg naming
# style. RUF012: mutable class attribute pattern used by some test fixtures.
"tests/*.py" = ["B905", "RUF043", "RUF012"]
# The tutorial-utils file mirrors a rendered notebook and carries the same
# no-lint discipline as the notebooks themselves.
"notebooks/_tutorial_utils.py" = ["ALL"]

# --- src per-file-ignores ------------------------------------------------
# Legitimate long lines in these files: multi-clause status-return statements
# and structured error-message strings whose readability suffers from
# arbitrary breaks. These files are frozen contract or reporting surfaces
# where breaking `_component_status("...", details=...)` calls into three
# lines each would hurt scan-ability with no correctness benefit.
"src/pdelie/reporting/summaries.py" = ["E501"]
"src/pdelie/symmetry/closure.py" = ["E501", "B905"]
"src/pdelie/symmetry/candidate_validation.py" = ["E501"]
"src/pdelie/residuals/burgers_1d.py" = ["E501"]
"src/pdelie/data/xarray_adapter.py" = ["E501"]
"src/pdelie/discovery/pysindy_adapter.py" = ["E501"]
"src/pdelie/data/numpy_adapter.py" = ["E501"]
"src/pdelie/data/kdv_1d.py" = ["E501"]
"src/pdelie/data/reaction_diffusion_1d.py" = ["E501"]
"src/pdelie/data/advection_diffusion_1d.py" = ["E501"]
"src/pdelie/discovery/contracts.py" = ["E501"]
"src/pdelie/discovery/translation_canonical.py" = ["E501"]
"src/pdelie/invariants/diagnostics.py" = ["E501"]
"src/pdelie/invariants/apply.py" = ["E501"]
"src/pdelie/verification/finite_transform.py" = ["E501"]
"src/pdelie/symmetry/parameterization/polynomial_translation.py" = ["E501"]
"src/pdelie/symmetry/fitting/translation_baseline.py" = ["E501"]
"src/pdelie/symmetry/symbolic.py" = ["E501"]
"src/pdelie/symmetry/_polynomial_metric.py" = ["E501"]
"src/pdelie/residuals/weak_1d.py" = ["E501"]
"src/pdelie/viz/span.py" = ["E501"]
"src/pdelie/viz/closure.py" = ["E501"]
"src/pdelie/contracts.py" = ["E501"]
# Runtime example scripts print long JSON blobs and reference their own
# path in comments; formatting churn adds no value.
"src/pdelie/examples/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_unreachable = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
# v0.30e strict scope: the core contract layer plus the derivative backend.
# NumPy strict-typing pain (missing type-args on ndarray without stubs) makes
# data/* and residuals/* impractical at strict mode without significant
# clutter for no correctness benefit. Broaden the scope in v0.30.1 or later.
module = [
    "pdelie.contracts",
    "pdelie._boundary",
    "pdelie.derivatives.*",
]
strict = true

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "xarray.*",
    "pysindy.*",
    "sklearn.*",
    "sympy.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/pdelie"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
