name: alpha-migration

# v0.36a-alpha: the paper-critical migration audit.
#
# MANUAL ONLY. This builds two wheels, creates two virtualenvs across a major
# Python/NumPy boundary, and runs both pipelines. It is far too heavy for every
# PR, and its result is evidence to read rather than a gate to pass. The
# contract tests that DO gate every PR live in
# tests/test_v0_36a_alpha_paper_migration.py.

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Experiment config to audit"
        required: true
        default: hard_heat_experiment
        type: choice
        options: [hard_heat_experiment, burgers_experiment]

permissions:
  contents: read

jobs:
  alpha-migration:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # the legacy worktree needs the v0.22.0 tag

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The orchestrator shells out to `uv venv` four times to build the two
      # isolated environments. Without this the run dies at the first call with
      # FileNotFoundError, before any wheel is built.
      - name: Install uv
        uses: astral-sh/setup-uv@f94ec6bedd8674c4426838e6b50417d36b6ab231 # v5.1.0

      - name: Run the migration orchestrator
        run: python scripts/run_alpha_migration.py --experiment "${{ inputs.experiment }}" --output-dir migration_out

      - name: Upload the migration report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha-migration-report-${{ inputs.experiment }}
          path: migration_out/
          retention-days: 30
