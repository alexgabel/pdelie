name: benchmark-platform-replay

# v0.37.1: the Linux half of the admissibility benchmark.
#
# Every number in the v0.37c confirmatory freeze was produced on macOS/arm64.
# The freeze says so, and says the eleven-order margin makes a cross-platform
# classification flip implausible -- which is an argument, not a measurement.
# This lane produces the measurement.
#
# MANUAL ONLY. It is evidence to read, not a gate every PR passes, and the
# contract tests that DO gate every PR are separate. Running it costs a full
# benchmark sweep across both phases.
#
# It uses the SEED PACKET FROZEN AT v0.37.1 -- 13, 17, 19, 23, 29 -- because a
# paired comparison needs the same draws on both sides. Substituting seeds would
# compare two different experiments and attribute the difference to the platform.

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seed packet, comma-separated. Default is the v0.37.1 frozen packet."
        required: true
        default: "13,17,19,23,29"
        type: string
      phase:
        description: "Which alpha grid to run"
        required: true
        default: confirmatory
        type: choice
        options: [confirmatory, pilot, both]

permissions:
  contents: read

jobs:
  # Fails in seconds if a requested platform/version/arch tuple does not exist,
  # rather than after the matrix has launched. Run 31278210299 spent a job-hour
  # and produced a misleading secondary artifact-upload error before anyone
  # learned the cell was impossible.
  validate-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Every requested runner cell must exist
        run: python scripts/validate_runner_matrix.py

  replay:
    needs: validate-matrix
    name: replay (${{ matrix.os }} py${{ matrix.python }} ${{ matrix.role }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Both sides run here rather than comparing against a stored macOS
        # result: a stored number carries the toolchain it was produced with,
        # and a difference would be unattributable between platform and drift.
        #
        # v0.38 Gate F closure: a 2x2 Python-patch corner, not a full factorial.
        # Run 30930069491 compared macOS/3.12.10 against Linux/3.12.13, which is
        # end-to-end reproducibility rather than a controlled platform check. The
        # two matched diagonals establish whether patch drift is load-bearing.
        # Three runners, matching configs/gate_f_replay_scope.json. The
        # originally specified 2x2 corner is NOT constructible: macOS/arm64 has
        # no CPython 3.12.11+, so `macos-14 x 3.12.13` failed at setup-python in
        # run 31278210299 and no re-run will produce it.
        #
        # These three are a better design anyway -- each pair isolates ONE
        # variable, where the 2x2 had two mixed cells:
        #   macOS/3.12.10 vs Linux/3.12.10  -> platform isolated
        #   Linux/3.12.10 vs Linux/3.12.13  -> python patch isolated
        include:
          - os: macos-14
            python: "3.12.10"
            role: platform_comparison
          - os: ubuntu-22.04
            python: "3.12.10"
            role: platform_comparison
          - os: ubuntu-22.04
            python: "3.12.13"
            role: patch_comparison
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]

      - name: Run the admissibility benchmark
        shell: bash
        run: |
          python - <<'PY'
          import json, os, platform, sys
          from pdelie.benchmarks import run_admissibility_benchmark

          seeds = [int(s) for s in os.environ["SEEDS"].split(",") if s.strip()]
          phases = (
              ["pilot", "confirmatory"]
              if os.environ["PHASE"] == "both"
              else [os.environ["PHASE"]]
          )
          out = {
              "platform": {
                  "system": platform.system(),
                  "machine": platform.machine(),
                  "python": platform.python_version(),
              },
              "seeds": seeds,
              "runs": {p: run_admissibility_benchmark(phase=p, seeds=seeds) for p in phases},
          }
          import numpy
          out["platform"]["numpy"] = numpy.__version__
          with open("replay.json", "w") as handle:
              json.dump(out, handle, indent=2, allow_nan=False)
          print(json.dumps(out["platform"], indent=2))
          PY
        env:
          SEEDS: ${{ inputs.seeds }}
          PHASE: ${{ inputs.phase }}

      # Gate F closure: the v0.38b/c/d tolerance_numeric workloads the
      # benchmark lane never touches. 286 rows per runner.
      - name: Run the Gate F closure workloads
        run: python scripts/replay_workloads.py gate_f_replay.json

      # `always()` reported "No files were found" on a runner that failed at
      # setup-python, which read as a second, unrelated defect. The setup
      # failure is still a first-class job failure -- this step simply stops
      # adding a misleading one on top of it.
      - name: Upload measurements
        if: hashFiles('replay.json', 'gate_f_replay.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: replay-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            replay.json
            gate_f_replay.json
          if-no-files-found: error
