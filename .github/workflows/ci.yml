name: ci

on:
  push:
  pull_request:

jobs:
  v0_19-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        shell: bash
        run: |
          retry() {
            local attempts="$1"
            shift
            local count=1
            until "$@"; do
              if [ "${count}" -ge "${attempts}" ]; then
                return 1
              fi
              count=$((count + 1))
              echo "Retrying (${count}/${attempts}): $*"
              sleep 5
            done
          }
          retry 3 python -m pip install --upgrade pip
          retry 3 python -m pip install -e .[test]
      - name: Check dependencies
        run: python -m pip check
      - name: Run V0.19 release gate
        run: python -m pytest tests/test_v0_19_release_gate.py
  editable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        shell: bash
        run: |
          retry() {
            local attempts="$1"
            shift
            local count=1
            until "$@"; do
              if [ "${count}" -ge "${attempts}" ]; then
                return 1
              fi
              count=$((count + 1))
              echo "Retrying (${count}/${attempts}): $*"
              sleep 5
            done
          }
          retry 3 python -m pip install --upgrade pip
          retry 3 python -m pip install -e .[test]
      - name: Check dependencies
        run: python -m pip check
      - name: Run test suite
        run: python -m pytest
      - name: Example smoke (editable install)
        run: |
          python -m pdelie.examples.heat_vertical_slice
          python -m pdelie.examples.kdv_vertical_slice
          python -m pdelie.examples.reaction_diffusion_vertical_slice
          python -m pdelie.examples.advection_diffusion_vertical_slice
          python -m pdelie.examples.orbit_coverage_diagnostics
          python -m pdelie.examples.invariant_workflow_summary
          python -m pdelie.examples.translation_orbit_batch
          python -m pdelie.examples.symmetry_candidate_validation
          python -m pdelie.examples.formula_generator_validation
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging frontend
        shell: bash
        run: |
          retry() {
            local attempts="$1"
            shift
            local count=1
            until "$@"; do
              if [ "${count}" -ge "${attempts}" ]; then
                return 1
              fi
              count=$((count + 1))
              echo "Retrying (${count}/${attempts}): $*"
              sleep 5
            done
          }
          retry 3 python -m pip install --upgrade pip
          retry 3 python -m pip install build
      - name: Build sdist and wheel
        run: python -m build --sdist --wheel
      - name: Install built wheel into a clean venv
        shell: bash
        run: |
          retry() {
            local attempts="$1"
            shift
            local count=1
            until "$@"; do
              if [ "${count}" -ge "${attempts}" ]; then
                return 1
              fi
              count=$((count + 1))
              echo "Retrying (${count}/${attempts}): $*"
              sleep 5
            done
          }
          python -m venv /tmp/pdelie-rc-venv
          retry 3 /tmp/pdelie-rc-venv/bin/python -m pip install --upgrade pip
          retry 3 /tmp/pdelie-rc-venv/bin/python -m pip install dist/*.whl
      - name: Check dependencies (wheel env)
        run: /tmp/pdelie-rc-venv/bin/python -m pip check
      - name: Stable import smoke
        run: |
          /tmp/pdelie-rc-venv/bin/python - <<'PY'
          import pdelie

          from pdelie import FieldBatch, DerivativeBatch, ResidualBatch, ResidualEvaluator, GeneratorFamily, VerificationReport
          from pdelie.data import (
              generate_advection_diffusion_1d_field_batch,
              generate_reaction_diffusion_1d_field_batch,
          )
          from pdelie.examples import (
              run_advection_diffusion_vertical_slice_example,
              run_reaction_diffusion_vertical_slice_example,
          )
          from pdelie.invariants import (
              OrbitBatchResult,
              build_uniform_translation_orbit_batch,
              compute_periodic_window_coverage,
              diagnose_uniform_translation_consistency,
              summarize_uniform_translation_orbit,
          )
          from pdelie.reporting import (
              summarize_formula_generator_family,
              summarize_generator_fit_diagnostics,
              summarize_generator_family,
              summarize_invariant_workflow,
              summarize_residual_batch,
              summarize_verification_report,
              summarize_vertical_slice,
              summarize_weak_residual_report,
          )
          from pdelie.symmetry import FormulaGeneratorFamily, validate_symmetry_candidate
          from pdelie.residuals import AdvectionDiffusionResidualEvaluator, ReactionDiffusionResidualEvaluator

          assert FieldBatch is not None
          assert DerivativeBatch is not None
          assert ResidualBatch is not None
          assert ResidualEvaluator is not None
          assert GeneratorFamily is not None
          assert VerificationReport is not None
          assert OrbitBatchResult is not None
          assert build_uniform_translation_orbit_batch is not None
          assert compute_periodic_window_coverage is not None
          assert diagnose_uniform_translation_consistency is not None
          assert summarize_uniform_translation_orbit is not None
          assert summarize_generator_fit_diagnostics is not None
          assert summarize_formula_generator_family is not None
          assert summarize_generator_family is not None
          assert summarize_invariant_workflow is not None
          assert summarize_residual_batch is not None
          assert summarize_verification_report is not None
          assert summarize_vertical_slice is not None
          assert summarize_weak_residual_report is not None
          assert validate_symmetry_candidate is not None
          assert FormulaGeneratorFamily is not None
          assert generate_advection_diffusion_1d_field_batch is not None
          assert AdvectionDiffusionResidualEvaluator is not None
          assert run_advection_diffusion_vertical_slice_example is not None
          assert generate_reaction_diffusion_1d_field_batch is not None
          assert ReactionDiffusionResidualEvaluator is not None
          assert run_reaction_diffusion_vertical_slice_example is not None
          assert not hasattr(pdelie, "summarize_generator_fit_diagnostics")
          assert not hasattr(pdelie, "summarize_vertical_slice")
          assert not hasattr(pdelie, "compute_periodic_window_coverage")
          assert not hasattr(pdelie, "diagnose_uniform_translation_consistency")
          assert not hasattr(pdelie, "summarize_uniform_translation_orbit")
          assert not hasattr(pdelie, "summarize_invariant_workflow")
          assert not hasattr(pdelie, "build_uniform_translation_orbit_batch")
          assert not hasattr(pdelie, "OrbitBatchResult")
          assert not hasattr(pdelie, "validate_symmetry_candidate")
          assert not hasattr(pdelie, "FormulaGeneratorFamily")
          assert not hasattr(pdelie, "summarize_formula_generator_family")
          assert not hasattr(pdelie, "generate_advection_diffusion_1d_field_batch")
          assert not hasattr(pdelie, "AdvectionDiffusionResidualEvaluator")
          assert not hasattr(pdelie, "run_advection_diffusion_vertical_slice_example")
          assert not hasattr(pdelie, "generate_reaction_diffusion_1d_field_batch")
          assert not hasattr(pdelie, "ReactionDiffusionResidualEvaluator")
          assert not hasattr(pdelie, "run_reaction_diffusion_vertical_slice_example")
          print("stable-import-ok")
          PY
      - name: Formula generator smoke
        run: |
          /tmp/pdelie-rc-venv/bin/python - <<'PY'
          import json

          import pdelie
          from pdelie.data import generate_heat_1d_field_batch
          from pdelie.reporting import summarize_formula_generator_family
          from pdelie.residuals import HeatResidualEvaluator
          from pdelie.symmetry import FormulaGeneratorFamily, validate_symmetry_candidate

          formula = FormulaGeneratorFamily(
              formula_generators=[
                  {
                      "name": "wheel_formula_translation",
                      "components": {
                          "tau": {"node": "const", "value": 0.0},
                          "xi": {"node": "const", "value": 1.0},
                          "phi": {"node": "const", "value": 0.0},
                      },
                  }
              ]
          )
          summary = summarize_formula_generator_family(formula)
          field = generate_heat_1d_field_batch(batch_size=2, num_times=7, num_points=16, seed=17017)
          report = validate_symmetry_candidate(
              field,
              formula.to_dict(),
              residual_evaluator=HeatResidualEvaluator(),
              source_candidate_id="wheel-formula",
          )
          json.dumps(summary)
          json.dumps(report)
          assert summary["summary_type"] == "formula_generator_family"
          assert report["candidate_kind"] == "formula_generator_family"
          assert report["conclusion"] == "partially_validated"
          assert not hasattr(pdelie, "FormulaGeneratorFamily")
          assert not hasattr(pdelie, "summarize_formula_generator_family")
          assert not hasattr(pdelie, "CallableGeneratorFamily")
          print("formula-generator-smoke-ok")
          PY
      - name: Symmetry candidate validation smoke
        run: |
          /tmp/pdelie-rc-venv/bin/python - <<'PY'
          import json
          import numpy as np
          import pdelie

          from pdelie import GeneratorFamily, InvariantMapSpec
          from pdelie.contracts import _translation_generator_basis_spec
          from pdelie.data import generate_heat_1d_field_batch
          from pdelie.residuals import HeatResidualEvaluator
          from pdelie.symmetry import validate_symmetry_candidate

          generator = GeneratorFamily(
              parameterization="polynomial_translation_affine",
              coefficients=np.asarray([[1.0, 0.0, 0.0, 0.0]], dtype=float),
              basis_spec=_translation_generator_basis_spec(),
              normalization="l2_unit",
              diagnostics={},
          )
          field = generate_heat_1d_field_batch(batch_size=3, num_times=7, num_points=16, seed=16016)
          generator_report = validate_symmetry_candidate(
              field,
              generator.to_dict(),
              residual_evaluator=HeatResidualEvaluator(),
              source_candidate_id="wheel-generator",
          )
          spec = InvariantMapSpec(
              generator_metadata=generator.to_dict(),
              construction_method="uniform_translation",
              parameters={"axis": "x", "shift": 0.1},
              domain_validity="global",
              inverse_available=True,
              diagnostics={},
          )
          spec_report = validate_symmetry_candidate(
              field,
              spec.to_dict(),
              residual_evaluator=HeatResidualEvaluator(),
              source_candidate_id="wheel-spec",
          )
          failed_report = validate_symmetry_candidate(
              field,
              GeneratorFamily(
                  parameterization="polynomial_translation_affine",
                  coefficients=np.asarray([[0.0, 0.0, 1.0, 0.0]], dtype=float),
                  basis_spec=_translation_generator_basis_spec(),
                  normalization="l2_unit",
                  diagnostics={},
              ),
              residual_evaluator=HeatResidualEvaluator(),
          )
          json.dumps(generator_report)
          json.dumps(spec_report)
          json.dumps(failed_report)
          assert generator_report["candidate_kind"] == "generator_family"
          assert generator_report["conclusion"] == "validated"
          assert spec_report["candidate_kind"] == "invariant_map_spec"
          assert spec_report["conclusion"] == "validated"
          assert failed_report["conclusion"] == "failed"
          assert not hasattr(pdelie, "validate_symmetry_candidate")
          assert not hasattr(pdelie, "FormulaGeneratorFamily")
          assert not hasattr(pdelie, "CallableGeneratorFamily")
          print("symmetry-candidate-validation-smoke-ok")
          PY
      - name: Invariant diagnostics smoke
        run: |
          /tmp/pdelie-rc-venv/bin/python - <<'PY'
          import json
          import numpy as np
          import pdelie

          from pdelie.data import generate_heat_1d_field_batch
          from pdelie.invariants import (
              build_uniform_translation_orbit_batch,
              compute_periodic_window_coverage,
              diagnose_uniform_translation_consistency,
              summarize_uniform_translation_orbit,
          )
          from pdelie.reporting import summarize_invariant_workflow
          from pdelie.residuals import HeatResidualEvaluator

          domain_length = 2.0 * np.pi
          x = np.linspace(0.0, domain_length, 16, endpoint=False)
          coverage = compute_periodic_window_coverage(
              x=x,
              windows=[{"start": 0.0, "width": domain_length / 4.0}],
              shifts=[0.0, domain_length / 2.0],
              domain_length=domain_length,
          )
          json.dumps(coverage)
          assert coverage["summary_type"] == "periodic_window_coverage"
          assert coverage["coverage_fraction"] == 0.5

          field = generate_heat_1d_field_batch(batch_size=1, num_times=5, num_points=16, seed=13013)
          orbit_batch = build_uniform_translation_orbit_batch(
              field,
              shifts=[0.0, domain_length],
              source_field_id="package-smoke-heat",
          )
          json.dumps(orbit_batch.report)
          assert orbit_batch.report["summary_type"] == "uniform_translation_orbit_batch"
          assert orbit_batch.field.values.shape[0] == 2
          assert orbit_batch.report["source_batch_indices"] == [0, 0]
          assert orbit_batch.report["shift_indices"] == [0, 1]

          consistency = diagnose_uniform_translation_consistency(
              field,
              shifts=[0.0, domain_length],
              residual_evaluator=HeatResidualEvaluator(),
          )
          json.dumps(consistency)
          assert consistency["summary_type"] == "uniform_translation_consistency"
          assert all(report["inverse_passed"] for report in consistency["shift_reports"])
          assert all(report["period_wrap_passed"] for report in consistency["shift_reports"])
          orbit = summarize_uniform_translation_orbit(
              field,
              shifts=[0.0, domain_length],
              windows=[{"start": 0.0, "width": domain_length / 4.0}],
              residual_evaluator=HeatResidualEvaluator(),
              source_field_id="package-smoke-heat",
          )
          workflow = summarize_invariant_workflow(
              orbit=orbit,
              coverage=orbit["coverage"],
              consistency=orbit["consistency"],
              extra_metrics={"smoke": "invariant_workflow"},
          )
          json.dumps(workflow)
          assert orbit["summary_type"] == "uniform_translation_orbit"
          assert orbit["orbit_passed"] is True
          assert workflow["summary_type"] == "invariant_workflow"
          assert not hasattr(pdelie, "compute_periodic_window_coverage")
          assert not hasattr(pdelie, "diagnose_uniform_translation_consistency")
          assert not hasattr(pdelie, "summarize_uniform_translation_orbit")
          assert not hasattr(pdelie, "summarize_invariant_workflow")
          assert not hasattr(pdelie, "build_uniform_translation_orbit_batch")
          assert not hasattr(pdelie, "OrbitBatchResult")
          assert not hasattr(pdelie, "augment_translation_orbit")
          assert not hasattr(pdelie, "build_translation_orbit_dataset")
          print("invariant-diagnostics-smoke-ok")
          PY
      - name: Generator fit diagnostics smoke
        run: |
          /tmp/pdelie-rc-venv/bin/python - <<'PY'
          import json
          import numpy as np

          import pdelie
          from pdelie import GeneratorFamily
          from pdelie.contracts import _translation_generator_basis_spec
          from pdelie.reporting import summarize_generator_fit_diagnostics

          generator = GeneratorFamily(
              parameterization="polynomial_translation_affine",
              coefficients=np.asarray([[1.0, 0.0, 0.0, 0.0]], dtype=float),
              basis_spec=_translation_generator_basis_spec(),
              normalization="l2_unit",
              diagnostics={
                  "fit_mode": "svd",
                  "training_epsilon": 1e-4,
                  "basis": ["1", "t", "x", "u"],
                  "basis_delta_norms": {"1": 1.0, "t": 2.0, "x": 3.0, "u": 4.0},
                  "design_column_norms": {"1": 1.0, "t": 2.0, "x": 3.0, "u": 4.0},
                  "singular_values": [4.0, 2.0, 1.0],
                  "condition_number": 4.0,
                  "fit_residual": 1e-8,
                  "min_delta_basis": "1",
                  "selected_coefficients": [1.0, 0.0, 0.0, 0.0],
                  "svd_coefficients": [1.0, 0.0, 0.0, 0.0],
                  "selected_span_distance": 0.0,
                  "svd_span_distance": 0.0,
                  "reference_fallback_used": False,
                  "fallback_reason": None,
                  "evidence_label": "direct_svd_in_tolerance",
              },
          )
          summary = summarize_generator_fit_diagnostics(generator)
          json.dumps(summary)
          assert summary["summary_type"] == "generator_fit_diagnostics"
          assert summary["condition_number"] == 4.0
          assert summary["evidence_label"] == "direct_svd_in_tolerance"
          assert not hasattr(pdelie, "summarize_generator_fit_diagnostics")
          assert not hasattr(pdelie, "generate_ks_1d_field_batch")
          assert not hasattr(pdelie, "summarize_orbit_coverage")
          assert not hasattr(pdelie, "augment_translation_orbit")
          assert not hasattr(pdelie, "WeakKSResidualEvaluator")
          print("generator-fit-diagnostics-smoke-ok")
          PY
      - name: Weak residual report smoke
        run: |
          /tmp/pdelie-rc-venv/bin/python - <<'PY'
          import numpy as np

          from pdelie.data import generate_heat_1d_field_batch
          from pdelie.residuals import evaluate_weak_burgers_residual, evaluate_weak_heat_residual

          assert evaluate_weak_burgers_residual is not None
          field = generate_heat_1d_field_batch(batch_size=1, num_times=5, num_points=9, seed=123)
          report = evaluate_weak_heat_residual(field)
          expected_keys = {
              "equation",
              "equation_form",
              "method_family",
              "window_residuals",
              "time_window_centers",
              "x_window_centers",
              "normalization",
              "diagnostics",
          }
          assert set(report) == expected_keys
          assert report["method_family"] == "local_separable_quartic_bump_trapezoid_v1"
          assert report["normalization"] == "none"
          assert np.all(np.isfinite(report["window_residuals"]))
          print("weak-report-smoke-ok")
          PY
      - name: KdV strong path smoke
        run: |
          /tmp/pdelie-rc-venv/bin/python - <<'PY'
          import numpy as np
          import pdelie

          from pdelie.data import generate_kdv_1d_field_batch
          from pdelie.derivatives import compute_spectral_fd_derivatives
          from pdelie.residuals import KdVResidualEvaluator

          assert not hasattr(pdelie, "generate_kdv_1d_field_batch")
