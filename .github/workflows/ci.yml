      - name: Data ecosystem example smoke (wheel xarray extra)
        shell: bash
        run: |
          retry() {
            local attempts="$1"
            shift
            local count=1
            until "$@"; do
              if [ "${count}" -ge "${attempts}" ]; then
                return 1
              fi
              count=$((count + 1))
              echo "Retrying (${count}/${attempts}): $*"
              sleep 5
            done
          }
          wheel_uri="$(
            python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          print(wheels[0].resolve().as_uri())
          PY
          )"
          retry 3 /tmp/pdelie-rc-venv/bin/python -m pip install "pdelie[xarray] @ ${wheel_uri}"
          /tmp/pdelie-rc-venv/bin/python -m pdelie.examples.data_ecosystem_feasibility
      - name: Formula generator smoke
        run: |
          /tmp/pdelie-rc-venv/bin/python - <<'PY'
          import json

          import pdelie
          from pdelie.data import generate_heat_1d_field_batch
          from pdelie.reporting import summarize_formula_generator_family
          from pdelie.residuals import HeatResidualEvaluator
          from pdelie.symmetry import FormulaGeneratorFamily, validate_symmetry_candidate

          formula = FormulaGeneratorFamily(
              formula_generators=[
                  {
                      "name": "wheel_formula_translation",
                      "components": {
                          "tau": {"node": "const", "value": 0.0},
                          "xi": {"node": "const", "value": 1.0},
                          "phi": {"node": "const", "value": 0.0},
                      },
                  }
              ]
          )
          summary = summarize_formula_generator_family(formula)
          field = generate_heat_1d_field_batch(batch_size=2, num_times=7, num_points=16, seed=17017)
          report = validate_symmetry_candidate(
              field,
              formula.to_dict(),
              residual_evaluator=HeatResidualEvaluator(),
              source_candidate_id="wheel-formula",
          )
          json.dumps(summary)
          json.dumps(report)
          assert summary["summary_type"] == "formula_generator_family"
          assert report["candidate_kind"] == "formula_generator_family"
          assert report["conclusion"] == "partially_validated"
          assert not hasattr(pdelie, "FormulaGeneratorFamily")
          assert not hasattr(pdelie, "summarize_formula_generator_family")
          assert not hasattr(pdelie, "CallableGeneratorFamily")
          print("formula-generator-smoke-ok")
          PY
      - name: Symmetry candidate validation smoke
        run: |
          /tmp/pdelie-rc-venv/bin/python - <<'PY'
          import json
          import numpy as np
          import pdelie

          from pdelie import GeneratorFamily, InvariantMapSpec
          from pdelie.contracts import _translation_generator_basis_spec
          from pdelie.data import generate_heat_1d_field_batch
          from pdelie.residuals import HeatResidualEvaluator
          from pdelie.symmetry import validate_symmetry_candidate

          generator = GeneratorFamily(
              parameterization="polynomial_translation_affine",
              coefficients=np.asarray([[1.0, 0.0, 0.0, 0.0]], dtype=float),
              basis_spec=_translation_generator_basis_spec(),
              normalization="l2_unit",
              diagnostics={},
          )
          field = generate_heat_1d_field_batch(batch_size=3, num_times=7, num_points=16, seed=16016)
          generator_report = validate_symmetry_candidate(
              field,
              generator.to_dict(),
              residual_evaluator=HeatResidualEvaluator(),
              source_candidate_id="wheel-generator",
          )
          spec = InvariantMapSpec(
              generator_metadata=generator.to_dict(),
              construction_method="uniform_translation",
              parameters={"axis": "x", "shift": 0.1},
              domain_validity="global",
              inverse_available=True,
              diagnostics={},
          )
          spec_report = validate_symmetry_candidate(
              field,
              spec.to_dict(),
              residual_evaluator=HeatResidualEvaluator(),
              source_candidate_id="wheel-spec",
          )
          failed_report = validate_symmetry_candidate(
              field,
              GeneratorFamily(
                  parameterization="polynomial_translation_affine",
                  coefficients=np.asarray([[0.0, 0.0, 1.0, 0.0]], dtype=float),
                  basis_spec=_translation_generator_basis_spec(),
                  normalization="l2_unit",
                  diagnostics={},
              ),
              residual_evaluator=HeatResidualEvaluator(),
          )
          json.dumps(generator_report)
          json.dumps(spec_report)
          json.dumps(failed_report)
          assert generator_report["candidate_kind"] == "generator_family"
          assert generator_report["conclusion"] == "validated"
          assert spec_report["candidate_kind"] == "invariant_map_spec"
          assert spec_report["conclusion"] == "validated"
          assert failed_report["conclusion"] == "failed"
          assert not hasattr(pdelie, "validate_symmetry_candidate")
          assert not hasattr(pdelie, "FormulaGeneratorFamily")
          assert not hasattr(pdelie, "CallableGeneratorFamily")
          print("symmetry-candidate-validation-smoke-ok")
          PY
      - name: Invariant diagnostics smoke
        run: |
          /tmp/pdelie-rc-venv/bin/python - <<'PY'
          import json
          import numpy as np
          import pdelie

          from pdelie.data import generate_heat_1d_field_batch
          from pdelie.invariants import (
              build_uniform_translation_orbit_batch,
              compute_periodic_window_coverage,
              diagnose_uniform_translation_consistency,
              summarize_uniform_translation_orbit,
          )
          from pdelie.reporting import summarize_invariant_workflow
          from pdelie.residuals import HeatResidualEvaluator

          domain_length = 2.0 * np.pi
          x = np.linspace(0.0, domain_length, 16, endpoint=False)
          coverage = compute_periodic_window_coverage(
              x=x,
              windows=[{"start": 0.0, "width": domain_length / 4.0}],
              shifts=[0.0, domain_length / 2.0],
              domain_length=domain_length,
          )
          json.dumps(coverage)
          assert coverage["summary_type"] == "periodic_window_coverage"
          assert coverage["coverage_fraction"] == 0.5

          field = generate_heat_1d_field_batch(batch_size=1, num_times=5, num_points=16, seed=13013)
          orbit_batch = build_uniform_translation_orbit_batch(
              field,
              shifts=[0.0, domain_length],
              source_field_id="package-smoke-heat",
          )
          json.dumps(orbit_batch.report)
          assert orbit_batch.report["summary_type"] == "uniform_translation_orbit_batch"
          assert orbit_batch.field.values.shape[0] == 2
          assert orbit_batch.report["source_batch_indices"] == [0, 0]
          assert orbit_batch.report["shift_indices"] == [0, 1]

          consistency = diagnose_uniform_translation_consistency(
              field,
              shifts=[0.0, domain_length],
              residual_evaluator=HeatResidualEvaluator(),
          )
          json.dumps(consistency)
          assert consistency["summary_type"] == "uniform_translation_consistency"
          assert all(report["inverse_passed"] for report in consistency["shift_reports"])
          assert all(report["period_wrap_passed"] for report in consistency["shift_reports"])
          orbit = summarize_uniform_translation_orbit(
              field,
              shifts=[0.0, domain_length],
              windows=[{"start": 0.0, "width": domain_length / 4.0}],
              residual_evaluator=HeatResidualEvaluator(),
              source_field_id="package-smoke-heat",
          )
          workflow = summarize_invariant_workflow(
              orbit=orbit,
              coverage=orbit["coverage"],
              consistency=orbit["consistency"],
              extra_metrics={"smoke": "invariant_workflow"},
          )
          json.dumps(workflow)
          assert orbit["summary_type"] == "uniform_translation_orbit"
          assert orbit["orbit_passed"] is True
          assert workflow["summary_type"] == "invariant_workflow"
