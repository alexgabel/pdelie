name: ci

on:
  push:
  pull_request:

jobs:
  v0_12-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        shell: bash
        run: |
          retry() {
            local attempts="$1"
            shift
            local count=1
            until "$@"; do
              if [ "${count}" -ge "${attempts}" ]; then
                return 1
              fi
              count=$((count + 1))
              echo "Retrying (${count}/${attempts}): $*"
              sleep 5
            done
          }
          retry 3 python -m pip install --upgrade pip
          retry 3 python -m pip install -e .[test]
      - name: Check dependencies
        run: python -m pip check
      - name: Run V0.12 release gate
        run: python -m pytest tests/test_v0_12_release_gate.py
  editable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        shell: bash
        run: |
          retry() {
            local attempts="$1"
            shift
            local count=1
            until "$@"; do
              if [ "${count}" -ge "${attempts}" ]; then
                return 1
              fi
              count=$((count + 1))
              echo "Retrying (${count}/${attempts}): $*"
              sleep 5
            done
          }
          retry 3 python -m pip install --upgrade pip
          retry 3 python -m pip install -e .[test]
      - name: Check dependencies
        run: python -m pip check
      - name: Run test suite
        run: python -m pytest
      - name: Example smoke (editable install)
        run: |
          python -m pdelie.examples.heat_vertical_slice
          python -m pdelie.examples.kdv_vertical_slice
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging frontend
        shell: bash
        run: |
          retry() {
            local attempts="$1"
            shift
            local count=1
            until "$@"; do
              if [ "${count}" -ge "${attempts}" ]; then
                return 1
              fi
              count=$((count + 1))
              echo "Retrying (${count}/${attempts}): $*"
              sleep 5
            done
          }
          retry 3 python -m pip install --upgrade pip
          retry 3 python -m pip install build
      - name: Build sdist and wheel
        run: python -m build --sdist --wheel
      - name: Install built wheel into a clean venv
        shell: bash
        run: |
          retry() {
            local attempts="$1"
            shift
            local count=1
            until "$@"; do
              if [ "${count}" -ge "${attempts}" ]; then
                return 1
              fi
              count=$((count + 1))
              echo "Retrying (${count}/${attempts}): $*"
              sleep 5
            done
          }
          python -m venv /tmp/pdelie-rc-venv
          retry 3 /tmp/pdelie-rc-venv/bin/python -m pip install --upgrade pip
          retry 3 /tmp/pdelie-rc-venv/bin/python -m pip install dist/*.whl
      - name: Check dependencies (wheel env)
        run: /tmp/pdelie-rc-venv/bin/python -m pip check
      - name: Stable import smoke
        run: |
          /tmp/pdelie-rc-venv/bin/python - <<'PY'
          import pdelie

          from pdelie import FieldBatch, DerivativeBatch, ResidualBatch, ResidualEvaluator, GeneratorFamily, VerificationReport
          from pdelie.reporting import (
              summarize_generator_fit_diagnostics,
              summarize_generator_family,
              summarize_residual_batch,
              summarize_verification_report,
              summarize_vertical_slice,
              summarize_weak_residual_report,
          )

          assert FieldBatch is not None
          assert DerivativeBatch is not None
          assert ResidualBatch is not None
          assert ResidualEvaluator is not None
          assert GeneratorFamily is not None
          assert VerificationReport is not None
          assert summarize_generator_fit_diagnostics is not None
          assert summarize_generator_family is not None
          assert summarize_residual_batch is not None
          assert summarize_verification_report is not None
          assert summarize_vertical_slice is not None
          assert summarize_weak_residual_report is not None
          assert not hasattr(pdelie, "summarize_generator_fit_diagnostics")
          assert not hasattr(pdelie, "summarize_vertical_slice")
          print("stable-import-ok")
          PY
      - name: Generator fit diagnostics smoke
        run: |
          /tmp/pdelie-rc-venv/bin/python - <<'PY'
          import json
          import numpy as np

          import pdelie
          from pdelie import GeneratorFamily
          from pdelie.contracts import _translation_generator_basis_spec
          from pdelie.reporting import summarize_generator_fit_diagnostics

          generator = GeneratorFamily(
              parameterization="polynomial_translation_affine",
              coefficients=np.asarray([[1.0, 0.0, 0.0, 0.0]], dtype=float),
              basis_spec=_translation_generator_basis_spec(),
              normalization="l2_unit",
              diagnostics={
                  "fit_mode": "svd",
                  "training_epsilon": 1e-4,
                  "basis": ["1", "t", "x", "u"],
                  "basis_delta_norms": {"1": 1.0, "t": 2.0, "x": 3.0, "u": 4.0},
                  "design_column_norms": {"1": 1.0, "t": 2.0, "x": 3.0, "u": 4.0},
                  "singular_values": [4.0, 2.0, 1.0],
                  "condition_number": 4.0,
                  "fit_residual": 1e-8,
                  "min_delta_basis": "1",
                  "selected_coefficients": [1.0, 0.0, 0.0, 0.0],
                  "svd_coefficients": [1.0, 0.0, 0.0, 0.0],
                  "selected_span_distance": 0.0,
                  "svd_span_distance": 0.0,
                  "reference_fallback_used": False,
                  "fallback_reason": None,
                  "evidence_label": "direct_svd_in_tolerance",
              },
          )
          summary = summarize_generator_fit_diagnostics(generator)
          json.dumps(summary)
          assert summary["summary_type"] == "generator_fit_diagnostics"
          assert summary["condition_number"] == 4.0
          assert summary["evidence_label"] == "direct_svd_in_tolerance"
          assert not hasattr(pdelie, "summarize_generator_fit_diagnostics")
          assert not hasattr(pdelie, "generate_ks_1d_field_batch")
          assert not hasattr(pdelie, "summarize_orbit_coverage")
          assert not hasattr(pdelie, "augment_translation_orbit")
          assert not hasattr(pdelie, "WeakKSResidualEvaluator")
          print("generator-fit-diagnostics-smoke-ok")
          PY
      - name: Weak residual report smoke
        run: |
          /tmp/pdelie-rc-venv/bin/python - <<'PY'
          import numpy as np

          from pdelie.data import generate_heat_1d_field_batch
          from pdelie.residuals import evaluate_weak_burgers_residual, evaluate_weak_heat_residual

          assert evaluate_weak_burgers_residual is not None
          field = generate_heat_1d_field_batch(batch_size=1, num_times=5, num_points=9, seed=123)
          report = evaluate_weak_heat_residual(field)
          expected_keys = {
              "equation",
              "equation_form",
              "method_family",
              "window_residuals",
              "time_window_centers",
              "x_window_centers",
              "normalization",
              "diagnostics",
          }
          assert set(report) == expected_keys
          assert report["method_family"] == "local_separable_quartic_bump_trapezoid_v1"
          assert report["normalization"] == "none"
          assert np.all(np.isfinite(report["window_residuals"]))
          print("weak-report-smoke-ok")
          PY
      - name: KdV strong path smoke
        run: |
          /tmp/pdelie-rc-venv/bin/python - <<'PY'
          import numpy as np
          import pdelie

          from pdelie.data import generate_kdv_1d_field_batch
          from pdelie.derivatives import compute_spectral_fd_derivatives
          from pdelie.residuals import KdVResidualEvaluator

          assert not hasattr(pdelie, "generate_kdv_1d_field_batch")
          assert not hasattr(pdelie, "KdVResidualEvaluator")
          field = generate_kdv_1d_field_batch(batch_size=1, num_times=5, num_points=16, num_modes=1, seed=123)
          derivatives = compute_spectral_fd_derivatives(field, max_spatial_order=3)
          assert "u_xxx" in derivatives.derivatives
          residual = KdVResidualEvaluator().evaluate(field, derivatives)
          assert np.isfinite(float(residual.diagnostics["max_abs_residual"]))
          assert np.isfinite(float(residual.diagnostics["rms_residual"]))
          print("kdv-smoke-ok")
          PY
      - name: Order-4 derivative smoke
        run: |
          /tmp/pdelie-rc-venv/bin/python - <<'PY'
          import numpy as np
          import pdelie

          from pdelie.data import generate_heat_1d_field_batch
          from pdelie.derivatives import compute_spectral_fd_derivatives

          assert not hasattr(pdelie, "compute_spectral_fd_derivatives")
          field = generate_heat_1d_field_batch(batch_size=1, num_times=5, num_points=16, seed=11011)
          derivatives = compute_spectral_fd_derivatives(field, max_spatial_order=4)
          assert "u_xxxx" in derivatives.derivatives
          assert np.all(np.isfinite(derivatives.derivatives["u_xxxx"]))
          assert not hasattr(pdelie, "generate_ks_1d_field_batch")
          print("order4-smoke-ok")
          PY
      - name: Example smoke and determinism
        run: |
          /tmp/pdelie-rc-venv/bin/python - <<'PY'
          import json
          import subprocess

          def run_example():
              completed = subprocess.run(
                  ["/tmp/pdelie-rc-venv/bin/python", "-m", "pdelie.examples.heat_vertical_slice"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return json.loads(completed.stdout)

          first = run_example()
          second = run_example()
          assert first == second, "example output is not deterministic across repeated runs"
          assert first["summary_type"] == "vertical_slice"
          assert first["derivative_backend"] == "spectral_fd"
          assert first["verification"]["classification"] == "exact"
          print("example-smoke-ok")
          PY
