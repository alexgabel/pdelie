name: ci

on:
  push:
  pull_request:

jobs:
  v0_30-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        shell: bash
        run: |
          retry() {
            local attempts="$1"
            shift
            local count=1
            until "$@"; do
              if [ "${count}" -ge "${attempts}" ]; then
                return 1
              fi
              count=$((count + 1))
              echo "Retrying (${count}/${attempts}): $*"
              sleep 5
            done
          }
          retry 3 python -m pip install --upgrade pip
          retry 3 python -m pip install -e .[test]
      - name: Check dependencies
        run: python -m pip check
      - name: Run v0.30 release gate (declarative manifest + all retained per-version gates)
        run: >
          python -m pytest
          tests/test_current_release_gate.py
          tests/test_release_gates.py
          tests/test_v0_4_release_gate.py
          tests/test_v0_6_release_gate.py
          tests/test_v0_7_release_gate.py
          tests/test_v0_8_release_gate.py
          tests/test_v0_9_release_gate.py
          tests/test_v0_10_release_gate.py
          tests/test_v0_11_release_gate.py
          tests/test_v0_12_release_gate.py
          tests/test_v0_13_release_gate.py
          tests/test_v0_14_release_gate.py
          tests/test_v0_15_release_gate.py
          tests/test_v0_16_release_gate.py
          tests/test_v0_17_release_gate.py
          tests/test_v0_18_release_gate.py
          tests/test_v0_19_release_gate.py
          tests/test_v0_20_release_gate.py
          tests/test_v0_21_release_gate.py
          tests/test_v0_22_release_gate.py
          tests/test_v0_23_release_gate.py
          tests/test_v0_24_release_gate.py
          tests/test_v0_25_release_gate.py
          tests/test_v0_26_release_gate.py
          tests/test_v0_27_release_gate.py
          tests/test_v0_28_release_gate.py
          tests/test_v0_29_release_gate.py
  # v0.30e hygiene phase 1 landed lint/typecheck/coverage as advisory.
  # v0.30.1a hygiene phase 2 (this PR) promotes `lint` from advisory to
  # blocking: a red run now fails the workflow. `typecheck` and `coverage`
  # remain advisory (`continue-on-error: true`) and are promoted in
  # v0.30.1b (coverage) and v0.30.1c-k (mypy strict-scope broadening).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        shell: bash
        run: |
          retry() {
            local attempts="$1"
            shift
            local count=1
            until "$@"; do
              if [ "${count}" -ge "${attempts}" ]; then
                return 1
              fi
              count=$((count + 1))
              echo "Retrying (${count}/${attempts}): $*"
              sleep 5
            done
          }
          retry 3 python -m pip install --upgrade pip
          retry 3 python -m pip install -e .[test]
      - name: Ruff lint (blocking as of v0.30.1a)
        run: python -m ruff check .
  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        shell: bash
        run: |
          retry() {
            local attempts="$1"
            shift
            local count=1
            until "$@"; do
              if [ "${count}" -ge "${attempts}" ]; then
                return 1
              fi
              count=$((count + 1))
              echo "Retrying (${count}/${attempts}): $*"
              sleep 5
            done
          }
          retry 3 python -m pip install --upgrade pip
          retry 3 python -m pip install -e .[test]
      - name: "Mypy (strict scope: contracts, _boundary, derivatives; lenient elsewhere)"
        continue-on-error: true
        run: python -m mypy src/pdelie
  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        shell: bash
        run: |
          retry() {
            local attempts="$1"
            shift
            local count=1
            until "$@"; do
              if [ "${count}" -ge "${attempts}" ]; then
                return 1
              fi
              count=$((count + 1))
              echo "Retrying (${count}/${attempts}): $*"
              sleep 5
            done
          }
          retry 3 python -m pip install --upgrade pip
          retry 3 python -m pip install -e .[test]
      - name: "pytest with coverage (non-blocking; floor 80%, current baseline ~86%)"
        continue-on-error: true
        run: python -m pytest --cov=src/pdelie --cov-report=xml --cov-report=term-missing
      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install documentation dependencies
        shell: bash
        run: |
          retry() {
            local attempts="$1"
            shift
            local count=1
            until "$@"; do
              if [ "${count}" -ge "${attempts}" ]; then
                return 1
              fi
              count=$((count + 1))
              echo "Retrying (${count}/${attempts}): $*"
              sleep 5
            done
          }
          retry 3 python -m pip install --upgrade pip
          retry 3 python -m pip install -r docs/requirements.txt
      - name: Build documentation
        run: sphinx-build -b html -W --keep-going docs docs/_build/html
  editable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        shell: bash
        run: |
          retry() {
            local attempts="$1"
            shift
            local count=1
            until "$@"; do
              if [ "${count}" -ge "${attempts}" ]; then
                return 1
              fi
              count=$((count + 1))
              echo "Retrying (${count}/${attempts}): $*"
              sleep 5
            done
          }
          retry 3 python -m pip install --upgrade pip
          retry 3 python -m pip install -e .[test]
      - name: Check dependencies
        run: python -m pip check
      - name: Run test suite
        run: python -m pytest
      - name: Example smoke (editable install)
        run: |
          python -m pdelie.examples.heat_vertical_slice
          python -m pdelie.examples.kdv_vertical_slice
          python -m pdelie.examples.kdv_scope_decision
          python -m pdelie.examples.multi_generator_diagnostics
          python -m pdelie.examples.data_ecosystem_feasibility
          python -m pdelie.examples.reaction_diffusion_vertical_slice
          python -m pdelie.examples.advection_diffusion_vertical_slice
          python -m pdelie.examples.orbit_coverage_diagnostics
          python -m pdelie.examples.invariant_workflow_summary
          python -m pdelie.examples.translation_orbit_batch
          python -m pdelie.examples.symmetry_candidate_validation
          python -m pdelie.examples.formula_generator_validation
          python -m pdelie.examples.generator_confidence_report
          python -m pdelie.examples.external_data_readiness
          python -m pdelie.examples.downstream_discovery_contracts
          python -m pdelie.examples.split_leakage_provenance
          python -m pdelie.examples.weak_form_supportability
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install packaging frontend
        shell: bash
        run: |
          retry() {
            local attempts="$1"
            shift
            local count=1
            until "$@"; do
              if [ "${count}" -ge "${attempts}" ]; then
                return 1
              fi
              count=$((count + 1))
              echo "Retrying (${count}/${attempts}): $*"
              sleep 5
            done
          }
          retry 3 python -m pip install --upgrade pip
          retry 3 python -m pip install build
      - name: Build sdist and wheel
        run: python -m build --sdist --wheel
      - name: Install built wheel into a clean venv
        shell: bash
        run: |
          retry() {
            local attempts="$1"
            shift
            local count=1
            until "$@"; do
              if [ "${count}" -ge "${attempts}" ]; then
                return 1
              fi
              count=$((count + 1))
              echo "Retrying (${count}/${attempts}): $*"
              sleep 5
            done
          }
          python -m venv /tmp/pdelie-rc-venv
          retry 3 /tmp/pdelie-rc-venv/bin/python -m pip install --upgrade pip
          retry 3 /tmp/pdelie-rc-venv/bin/python -m pip install dist/*.whl
      - name: Check dependencies (wheel env)
        run: /tmp/pdelie-rc-venv/bin/python -m pip check
      - name: Stable import smoke
        run: |
          /tmp/pdelie-rc-venv/bin/python - <<'PY'
          import pdelie

          from pdelie import FieldBatch, DerivativeBatch, ResidualBatch, ResidualEvaluator, GeneratorFamily, VerificationReport
          from pdelie.data import (
              from_xarray_dataset,
              generate_advection_diffusion_1d_field_batch,
              generate_reaction_diffusion_1d_field_batch,
          )
          from pdelie.examples import (
              run_advection_diffusion_vertical_slice_example,
              run_data_ecosystem_feasibility_example,
              run_downstream_discovery_contracts_example,
              run_external_data_readiness_example,
              run_kdv_scope_decision_example,
              run_multi_generator_diagnostics_example,
              run_reaction_diffusion_vertical_slice_example,
              run_split_leakage_provenance_example,
              run_weak_form_supportability_example,
          )
          from pdelie.discovery import summarize_discovery_bridge_output, summarize_discovery_result
          from pdelie.invariants import (
              OrbitBatchResult,
              build_uniform_translation_orbit_batch,
