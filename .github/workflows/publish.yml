name: publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
      git_ref:
        description: "Git ref to build and publish (for example: v0.4.0rc1 or v0.4.0)"
        required: true
        type: string
      confirm_pypi:
        description: "Required only for PyPI: enter publish-to-pypi"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate publish inputs
        shell: bash
        run: |
          target="${{ inputs.target }}"
          git_ref="${{ inputs.git_ref }}"
          confirm_pypi="${{ inputs.confirm_pypi }}"

          if [ -z "${git_ref}" ]; then
            echo "git_ref is required"
            exit 1
          fi

          if [ "${target}" = "pypi" ]; then
            if [ "${confirm_pypi}" != "publish-to-pypi" ]; then
              echo "PyPI publish requires confirm_pypi=publish-to-pypi"
              exit 1
            fi
            case "${git_ref}" in
              *rc*)
                echo "PyPI publish must use a final release ref, not an rc ref"
                exit 1
                ;;
              refs/tags/v*|v*)
                ;;
              *)
                echo "PyPI publish must use a final version tag/ref"
                exit 1
                ;;
            esac
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.git_ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install packaging frontend
        run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build --sdist --wheel
      # The artifact that gets published must be byte-identical to the artifact
      # that was built. Without this, a compromised or flaky artifact store is
      # indistinguishable from a correct one at the upload step -- and the
      # upload step is the one holding id-token: write.
      - name: Hash the distribution artifacts
        shell: bash
        run: |
          sha256sum dist/* > SHA256SUMS
          cat SHA256SUMS
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
      - name: Upload the checksum manifest
        # Kept out of dist/ deliberately: everything in dist/ is offered to the
        # index, and SHA256SUMS is not a distribution.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checksums
          path: SHA256SUMS
          if-no-files-found: error

  publish-testpypi:
    if: ${{ inputs.target == 'testpypi' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pdelie
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Download the checksum manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checksums
      - name: Verify artifact hashes before upload
        shell: bash
        run: |
          sha256sum -c SHA256SUMS
          echo "artifact hashes match the build job"
      - name: Publish to TestPyPI
        # No skip-existing: index versions are immutable, so a silent skip would
        # report success while publishing nothing. A defect means rc2.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    if: ${{ inputs.target == 'pypi' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/pdelie
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Download the checksum manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checksums
      - name: Verify artifact hashes before upload
        shell: bash
        run: |
          sha256sum -c SHA256SUMS
          echo "artifact hashes match the build job"
      - name: Publish to PyPI
        # No skip-existing, for the same reason as TestPyPI.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
